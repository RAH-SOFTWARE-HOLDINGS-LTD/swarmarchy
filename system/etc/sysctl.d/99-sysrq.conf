# Magic SysRq: a kernel-level keyboard hotline, handled directly in the input path,
# so it still works when userspace is wedged and nothing else responds.
#
# The point is Alt+SysRq+R,E,I,S,U,B -- take back the keyboard, terminate, kill,
# SYNC, remount read-only, reboot. On a frozen machine that is the difference
# between a clean shutdown and holding the power button with dirty filesystem
# buffers. Alt+SysRq+F also invokes the OOM killer when memory pressure has locked
# everything up.
#
# Arch's default is 16 (sync only). 1 enables all functions, including memory dumps
# and kill-all; all of them need physical keyboard access. Use 176 instead for the
# safe subset (sync + remount-ro + reboot) if that matters more than the rest.
kernel.sysrq = 1
