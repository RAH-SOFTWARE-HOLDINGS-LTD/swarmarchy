# Let iwd do its own DHCP and feed DNS to systemd-resolved.
#
# Without this file iwd defaults to EnableNetworkConfiguration=false: it only
# authenticates to the AP and leaves addressing to something else. The ISO installs
# with archinstall's `"network_config": {"type": "iso"}`, which copies the live
# archiso network setup into the target -- i.e. systemd-networkd enabled. So an ISO
# install ends up with a hybrid stack (networkd addressing + iwd auth) that the
# hand-built reference system has never had, and basics.sh disables networkd now.
#
# This matters beyond tidiness: networkd brings up EVERY link it matches, including
# a dock's USB ethernet. On the Yoga that adapter shares a hub with the keyboard and
# mouse, and its carrier flapping is followed ~600ms later by the whole chain
# dropping off the bus.
[General]
EnableNetworkConfiguration=true

[Network]
NameResolvingService=systemd
