# Disable the deepest CPU idle state (state1 = cpu-sleep-0) on every core.
#
# This machine (Snapdragon X Elite, x1e80100) hard-hangs silently with no panic,
# no oops and nothing in pstore -- the watchdog does not even fire. Deep idle is
# the suspected cause: with state1 disabled it has run 4+ days clean, where it
# previously hung within about 3 days. The cost is slightly higher idle power.
#
# A tmpfiles rule rather than a systemd unit because systemd-tmpfiles-setup
# already runs at boot, so this adds no unit and no extra process. Type `w`
# accepts shell-style globs, so one line covers all cores regardless of count.
#
# To undo: delete this file and
#   echo 0 | sudo tee /sys/devices/system/cpu/*/cpuidle/state1/disable
w /sys/devices/system/cpu/*/cpuidle/state1/disable - - - - 1
