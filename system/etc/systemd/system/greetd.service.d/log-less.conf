# The oo7 PAM module (pam_oo7.so, upstream through 0.7.3) logs the login password's
# length at every login, with no option to turn it off. Keep greetd's own process to
# warnings and errors in the journal. This also drops greetd's routine info lines
# (config dump, "session opened for user"). The greeter itself runs in a logind session
# scope, not in this unit, so its journalctl -t greeter output is unaffected.
[Service]
LogLevelMax=warning
