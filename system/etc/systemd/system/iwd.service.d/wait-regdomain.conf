# Start iwd only once each Qualcomm ath12k chip has its regulatory domain; otherwise iwd
# can query the chip a moment too early and the kernel prints a WARN stack trace
# (nl80211_get_reg_do). See bin/swarmarchy-wifi-wait-regdomain.
[Service]
ExecStartPre=/usr/lib/swarmarchy/bin/swarmarchy-wifi-wait-regdomain
