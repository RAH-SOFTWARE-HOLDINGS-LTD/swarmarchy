# Compressed swap in RAM. zram-generator materializes a /dev/zram0 swap device
# from this config at boot. It gets a high swap priority, so the kernel uses it
# before any on-disk swap (a hibernation swapfile, if present, stays as low-prio
# overflow). Deployed verbatim from system/ by swarmarchy-dev-deploy.
[zram0]
# Logical (uncompressed) size of the zram swap. Half of RAM, capped at 8 GB —
# lzo-rle typically compresses ~2:1, so this costs at most ~half of that in real RAM.
zram-size = min(ram / 2, 8192)
# lzo-rle, not zstd: the ALARM linux-aarch64 kernel is built without zstd for zram
# (/sys/block/zram0/comp_algorithm lists only lzo-rle and lzo), so asking for zstd only
# made zram-setup warn and fall back to lzo-rle anyway.
compression-algorithm = lzo-rle
swap-priority = 200
