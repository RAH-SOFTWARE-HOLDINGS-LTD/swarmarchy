# Compressed swap in RAM. zram-generator materializes a /dev/zram0 swap device
# from this config at boot. It gets a high swap priority, so the kernel uses it
# before any on-disk swap (a hibernation swapfile, if present, stays as low-prio
# overflow). Installed to /etc/systemd/zram-generator.conf by install/config/zram.sh.
[zram0]
# Logical (uncompressed) size of the zram swap. Half of RAM, capped at 8 GB —
# with zstd (~3:1) this costs at most ~a third of that in real RAM.
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
