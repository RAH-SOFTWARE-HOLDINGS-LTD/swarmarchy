[main]
include=~/.config/swarmarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrains Mono:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[key-bindings]
# Keep Ctrl+Shift+C/V as well as Ctrl/Shift+Insert: the Yoga Slim 7x (83ED) and
# other compact keyboards have no Insert key, so the Insert-only defaults were
# unreachable. Listing both keeps foot's familiar Ctrl+Shift+C/V working too.
clipboard-copy=Control+Shift+c Control+Insert
primary-paste=none
clipboard-paste=Control+Shift+v Shift+Insert
