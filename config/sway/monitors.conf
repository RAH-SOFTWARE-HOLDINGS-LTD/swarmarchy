# Monitor / output configuration. See: man 5 sway-output
# List outputs and modes:  swaymsg -t get_outputs
# Format:  output <name> mode <WxH@Rhz> position <X,Y> scale <factor>

# Optimized for retina-class 2x displays (scale 2 + GDK_SCALE=2).
# GDK_SCALE is set in ~/.config/environment.d/sway.conf.
output * scale 2

# Good compromise for 27"/32" 4K (fractional):
# output * scale 1.6

# Straight 1x for 1080p/1440p or ultrawides:
# output * scale 1

# Portrait/rotated secondary (transform: 90 / 270):
# output DP-2 transform 90

# Example explicit dual-display:
# output eDP-1 mode 2880x1920@120Hz position 0,0 scale 2
# output DP-5 mode 6016x3384@60Hz position 1440,0 scale 2

# Disable a ghost output:
# output DP-2 disable
