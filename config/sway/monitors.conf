# Monitors. See: man 5 sway-output        Apply changes: swaymsg reload
#
# List your screens (name, resolution, position):
#   swaymsg -t get_outputs | jq -r '.[] | "\(.name)  \(.current_mode.width)x\(.current_mode.height)  at \(.rect.x),\(.rect.y)  scale \(.scale)"'
# The laptop screen is eDP-1; external screens are DP-1, DP-2, …
#
# Format:
#   output <name> [mode [--custom] <W>x<H>@<R>Hz] [position <X> <Y>] [scale <S>]
#
# How the numbers work:
# - Every screen is placed on one big canvas. `position` is the screen's top-left
#   corner on that canvas, in logical pixels.
# - Logical size = real pixels ÷ scale. A 2560x1600 screen at scale 1 is 2560 wide;
#   at scale 2 it is 1280 wide. Use the logical size when working out positions.
# - Screens touch when one's position starts where the other's logical size ends.
# - Negative positions are fine; Sway shifts the whole canvas so it starts at 0,0.
#
# - `mode --custom` forces a resolution the screen doesn't advertise. Only needed
#   when a monitor or adapter/KVM reports no EDID and Sway would otherwise pick a
#   wrong mode.
# - One physical monitor can show up under two names (e.g. DP-2 and DP-3) depending
#   on which port or replug order it came up on. Give both names the same line.

# Bare minimum: no scaling. Raise it (e.g. 1.5 or 2) on a small high-resolution
# screen if text is too small.
output * scale 1

# Example: two 2560x1600 monitors side by side, with a 2944x1840 laptop screen
# below them, right edges lined up.
#   DP-1 at 0,0 and the right monitor at 2560,0 (DP-1 is 2560 wide).
#   The laptop's top is at 1600 (the monitors are 1600 tall). To put its right
#   edge where the two monitors meet (x = 2560), its x is 2560 - <logical width>.
#   eDP-1 is 2944 physical pixels at scale 1.333333, so its logical width is
#   2944 / 1.333333 = 2208, and its x is 2560 - 2208 = 352. At scale 1 the same
#   alignment was 2560 - 2944 = -384.
#
# IMPORTANT on the Yoga Slim 7x (x1e80100): leave these ACTIVE, and keep an explicit
# mode on every DP output. Left to auto-negotiate, the kernel picks the mode the panels
# advertise and DP link training fails on phy 1:
#   [drm:msm_dp_ctrl_link_train_1_2] *ERROR* link training #2 on phy 1 failed. ret=-110
#   [drm:msm_dp_display_atomic_enable] *ERROR* Failed link training (rc=-104)
# It then retrains in a loop, and because DP-alt and USB3 share the Type-C lanes, every
# retrain renegotiates the port -- which resets the USB hub and knocks keyboards and mice
# off it with -62/-71. Forcing 60Hz trains first time: measured 10 link-training errors
# with auto, 0 with these lines, and USB enumeration errors dropped with it.
# Adjust the resolution/positions to your own screens, but keep the explicit @60Hz.
output DP-1  mode --custom 2560x1600@60Hz position 0 0
output DP-2  mode --custom 2560x1600@60Hz position 2560 0
output DP-3  mode --custom 2560x1600@60Hz position 2560 0
output eDP-1 position 352 1600 scale 1.333333

# Pin workspaces to screens. Sway uses the first listed screen that is connected,
# and moves the workspace back when that screen returns (sleep, replug, lid open).
# Pinning applies when a workspace is created; one that already exists stays put.
# To fix the numbers without moving any windows, rename instead, e.g. to swap 1 and 3:
#   swaymsg 'rename workspace 1 to tmp; rename workspace 3 to 1; rename workspace tmp to 3'
# (Moving a workspace with `move workspace to output` takes its windows with it.)
#
# workspace 1 output eDP-1
# workspace 2 output DP-1 eDP-1
# workspace 3 output DP-3 DP-2 eDP-1
