# Personal application bindings (loaded after the defaults; override freely).
# Translated from config/hypr/bindings.conf.

# Terminal / tmux
bindsym $mod+Return     exec $term --dir="$(omarchy-cmd-terminal-cwd)"
bindsym $mod+Alt+Return exec $term --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"

# Browser
bindsym $mod+Shift+Return  exec omarchy-launch-browser
bindsym $mod+Shift+b       exec omarchy-launch-browser
bindsym $mod+Shift+Alt+b   exec omarchy-launch-browser --private

# Files
bindsym $mod+Shift+f     exec nautilus --new-window
bindsym $mod+Shift+Alt+f exec nautilus --new-window "$(omarchy-cmd-terminal-cwd)"

# Editor
bindsym $mod+Shift+n exec omarchy-launch-editor

# ── Removed apps (dropped from this aarch64 build; reinstall then uncomment) ──
