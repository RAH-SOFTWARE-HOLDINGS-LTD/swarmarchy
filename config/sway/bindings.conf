# Web apps (Chromium-based — work fine on Sway/aarch64)
bindsym $mod+Shift+a       exec swarmarchy-launch-webapp "https://chatgpt.com"
bindsym $mod+Shift+Alt+a   exec swarmarchy-launch-webapp "https://grok.com"
# (HEY calendar/email web-apps removed — not used)
bindsym $mod+Shift+y       exec swarmarchy-launch-webapp "https://youtube.com/"
bindsym $mod+Shift+Alt+g   exec swarmarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindsym $mod+Shift+Ctrl+g  exec swarmarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindsym $mod+Shift+p       exec swarmarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindsym $mod+Shift+x       exec swarmarchy-launch-webapp "https://x.com/"
bindsym $mod+Shift+Alt+x   exec swarmarchy-launch-webapp "https://x.com/compose/post"
