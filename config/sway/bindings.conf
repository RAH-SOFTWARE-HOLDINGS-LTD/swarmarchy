# Personal application bindings (loaded after the defaults; override freely).

# Terminal / tmux
bindsym $mod+Return     exec $term --dir="$(swarmarchy-cmd-terminal-cwd)"
bindsym $mod+Alt+Return exec $term --dir="$(swarmarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"

# Browser
bindsym $mod+Shift+Return  exec swarmarchy-launch-browser
bindsym $mod+Shift+b       exec swarmarchy-launch-browser
bindsym $mod+Shift+Alt+b   exec swarmarchy-launch-browser --private

# Files
bindsym $mod+Shift+f     exec nautilus --new-window
bindsym $mod+Shift+Alt+f exec nautilus --new-window "$(swarmarchy-cmd-terminal-cwd)"

# Editor
bindsym $mod+Shift+n exec swarmarchy-launch-editor

