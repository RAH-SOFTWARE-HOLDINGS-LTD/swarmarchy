# Personal application bindings (loaded after the defaults; override freely).

# Terminal
bindsym $mod+Return     exec $term --dir="$(swarmarchy-cmd-terminal-cwd)"

# Browser
## Browser
bindsym $mod+Alt+Return       exec swarmarchy-launch-browser
## Private browser
bindsym $mod+Alt+Shift+Return exec swarmarchy-launch-browser --private

# Files
## File manager (yazi)
bindsym $mod+e exec $fileManager

