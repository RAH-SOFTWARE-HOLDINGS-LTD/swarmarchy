# Personal yazi keybindings. See: https://yazi-rs.github.io/docs/configuration/keymap

# Compress the selection with ouch. Defaults to zip; the format follows the
# extension you give the output file.
[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

# Transcode the selection (or the hovered file) with swarmarchy-transcode. This replaces
# the "Transcode" Nautilus right-click action. No terminal window: the script asks for
# format and size with Walker and reports progress with notifications, and a terminal
# opening at the same moment steals focus and dismisses the Walker picker.
[[mgr.prepend_keymap]]
on = ["<A-t>"]
run = '''shell --orphan -- bash -c 'for f in "$@"; do swarmarchy-transcode "$f" || true; done' _ %s'''
desc = "Transcode with swarmarchy-transcode"

# Send the selection (or the hovered file) with LocalSend. This replaces the
# "Send via LocalSend" Nautilus right-click action.
[[mgr.prepend_keymap]]
on = ["<A-l>"]
run = "shell --orphan -- localsend --headless send %s"
desc = "Send via LocalSend"

# Extract the selection (or the hovered archive) with ouch, next to the archive. Yazi's
# own extract action needs 7zip, which we don't install. --block so ouch can ask
# before overwriting anything.
[[mgr.prepend_keymap]]
on = ["<A-e>"]
run = "shell --block -- ouch decompress %s"
desc = "Extract with ouch"
