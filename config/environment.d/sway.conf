# Wayland/session environment for Sway (systemd user environment, read at login).
# Replaces the env block from default/hypr/envs.conf and the uwsm env setup
# (uwsm has been removed). Loaded by the graphical session via pam_systemd.

# Toolkit Wayland backends
GDK_BACKEND=wayland,x11,*
QT_QPA_PLATFORM=wayland;xcb
QT_STYLE_OVERRIDE=kvantum
MOZ_ENABLE_WAYLAND=1
ELECTRON_OZONE_PLATFORM_HINT=wayland
OZONE_PLATFORM=wayland
XDG_SESSION_TYPE=wayland

# Desktop identity — IMPORTANT: xdg-desktop-portal-wlr matches on "sway"
XDG_CURRENT_DESKTOP=sway
XDG_SESSION_DESKTOP=sway

# HiDPI (hypr monitors.conf set GDK_SCALE=2 for 2x displays)
GDK_SCALE=2
XCURSOR_SIZE=24

# XCompose
XCOMPOSEFILE=${HOME}/.XCompose

# Swarmarchy paths (previously set by uwsm/env). Lets GUI-launched swarmarchy-* resolve.
SWARMARCHY_PATH=${HOME}/.local/share/swarmarchy
PATH=${HOME}/.local/share/swarmarchy/bin:${PATH}:${HOME}/.local/bin

# NOTE: `mise activate` is shell eval and cannot live here — it stays in bash init.
