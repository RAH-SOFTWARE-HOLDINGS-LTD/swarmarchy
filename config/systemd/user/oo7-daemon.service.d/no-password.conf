# Swarmarchy default: the keyring has no real password.
#
# oo7 starts every keyring locked unless it is handed a secret at startup, and an
# empty secret means "stay locked" (oo7-daemon: read_secret_from_credentials_directory),
# so the first app to ask would get an unlock prompt. Instead the keyring is encrypted
# with this fixed, published value, which oo7 reads from its own systemd credential at
# startup and unlocks with: no login step, no prompt, no waiting at login.
#
# It protects nothing -- that is the point. While you are logged in, any program running
# as you can read an unlocked keyring anyway; at rest, the disk encryption covers it.
#
#   swarmarchy toggle keyring-password on   use your login password instead
#
# NEVER CHANGE THIS VALUE. Every existing keyring is encrypted with it: change it and
# those keyrings stay locked (Brave stops loading pages) until the old value is back.
# It is also hard-coded as FIXED in bin/swarmarchy-toggle-keyring-password.
[Service]
SetCredential=oo7.keyring-encryption-password:swarmarchy-no-password
