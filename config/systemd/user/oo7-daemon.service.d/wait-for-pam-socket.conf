# pam_oo7 (session phase) connects to %t/oo7-pam.sock right after the user
# manager reports startup finished. With Type=simple the unit counts as started
# the moment the binary is exec'd, before the daemon has created that socket,
# so the login password is dropped and the Login keyring stays locked.
# Hold the unit in "activating" until the socket exists; the user manager (and
# therefore PAM) waits for it.
[Service]
# The stock unit imports the optional systemd credential
# oo7.keyring-encryption-password (none is configured here). Credentials +
# Type=simple + ExecStartPost race: the main process and the ExecStartPost
# both set up the credentials dir and one fails with "File exists". Drop it.
ImportCredential=
ExecStartPre=/usr/bin/rm -f %t/oo7-pam.sock
ExecStartPost=/bin/sh -c 'until [ -S "%t/oo7-pam.sock" ]; do sleep 0.05; done'
TimeoutStartSec=15s
