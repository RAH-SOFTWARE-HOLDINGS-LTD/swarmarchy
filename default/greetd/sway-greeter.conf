# Sway configuration for the greetd greeter session.
#
# Replaces tuigreet. tuigreet drew on the kernel framebuffer console, where all
# outputs scan out one shared fb0 buffer cropped to their own size -- so there was
# a single centre position for three differently sized panels and the login box
# could not be centred on the externals. gtkgreet runs as a Wayland layer-shell
# surface inside this compositor, which sees real outputs and centres on each.

# Match the desktop's layout (see ~/.config/sway/monitors.conf) so the greeter
# appears where the session will.
output DP-1  mode --custom 2560x1600@60Hz position 0 0
output DP-2  mode --custom 2560x1600@60Hz position 2560 0
output DP-3  mode --custom 2560x1600@60Hz position 2560 0
output eDP-1 position -384 1600

# No Xwayland binary is installed (xorg-xwayland is in no manifest and is not a
# sway dependency), so stop sway looking for one and logging an error to the console
# at every login.
xwayland disable

# gtkgreet draws the prompt and, on success, greetd runs the command below as the
# logged-in user. When gtkgreet exits, tear this compositor down.
exec "gtkgreet --layer-shell --command swarmarchy-session; swaymsg exit"
