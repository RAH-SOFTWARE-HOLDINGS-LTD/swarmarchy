# Swarmarchy — Sway input

# Focus follows the mouse pointer
focus_follows_mouse yes

input "type:keyboard" {
    xkb_layout us
    xkb_options compose:caps
    # Key repeat
    repeat_rate 40
    repeat_delay 250
    # Enable numlock by default
    xkb_numlock enabled
}

input "type:touchpad" {
    natural_scroll disabled
    # Two/three-finger click = right/middle click
    click_method clickfinger
    scroll_factor 0.4
    dwt enabled
}

# input "type:pointer" {
