# Swarmarchy — Sway input (translated from default/hypr/input.conf + config/hypr/input.conf)

# follow_mouse = 1
focus_follows_mouse yes

input "type:keyboard" {
    xkb_layout us
    xkb_options compose:caps
    # hypr: repeat_rate 40 / repeat_delay 250 (from config/hypr/input.conf)
    repeat_rate 40
    repeat_delay 250
    # hypr: numlock_by_default = true
    xkb_numlock enabled
}

input "type:touchpad" {
    natural_scroll disabled
    # hypr: clickfinger_behavior = true
    click_method clickfinger
    # hypr: scroll_factor = 0.4
    scroll_factor 0.4
    dwt enabled
}

# input "type:pointer" {
#     accel_profile flat        # hypr: accel_profile = flat
#     pointer_accel 0           # hypr: sensitivity
# }

# DPMS-on-keypress/mouse (hypr misc.*_enables_dpms) is handled by swayidle resume.
