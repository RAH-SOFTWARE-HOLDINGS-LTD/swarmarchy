# Swarmarchy — Sway appearance (translated from default/hypr/looknfeel.conf)
# NOTE: Sway has no blur, shadows, animations, or rounding. Those Hyprland
# decoration/animation blocks are intentionally DROPPED (no Sway equivalent).

# Gaps (hypr: gaps_in=5 / gaps_out=10)
gaps inner 5
gaps outer 5
smart_gaps off

# Borders (hypr: border_size=2). Sway has no gradient borders -> solid colors.
default_border pixel 2
default_floating_border pixel 2
smart_borders on
titlebar_padding 1
hide_edge_borders smart

# Focus behaviour (hypr misc.focus_on_activate)
focus_on_window_activation smart

# Colors. Approximation of hypr $activeBorderColor / $inactiveBorderColor.
# These are overridden by the theme include (current/theme/sway.conf) when present.
#                       border    background  text      indicator  child_border
client.focused          #33ccffee #33ccffee  #ffffffff #00ff99ee  #33ccffee
client.focused_inactive #595959aa #595959aa  #ffffffff #595959aa  #595959aa
client.unfocused        #595959aa #595959aa  #aaaaaaff #595959aa  #595959aa
client.urgent           #ff5555ee #ff5555ee  #ffffffff #ff5555ee  #ff5555ee

# Layout (hypr dwindle ~= Sway's default manual tiling, split follows longer edge)
default_orientation auto
workspace_layout default
