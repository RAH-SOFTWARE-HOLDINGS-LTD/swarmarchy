# Swarmarchy — Sway window rules
# Sway uses `for_window [criteria] command`. xdg-shell apps match on app_id,
# XWayland apps match on class.

# Keep idle inhibited while any window is fullscreen
for_window [class=".*"] inhibit_idle fullscreen
for_window [app_id=".*"] inhibit_idle fullscreen

# Default window opacity (0.97 across the board).
for_window [app_id=".*"] opacity 0.97
for_window [class=".*"] opacity 0.97

# Picture-in-Picture: float + sticky
for_window [title="^Picture-in-Picture$"] floating enable, sticky enable
for_window [app_id="^.*pip.*$"] floating enable, sticky enable

# Common floating utilities
for_window [app_id="^(blueman-manager|nm-connection-editor|pavucontrol)$"] floating enable
for_window [app_id="^org.gnome.Calculator$"] floating enable
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable

# TODO: add more app-specific rules as needed (steam, telegram, qemu,
#   localsend, jetbrains, webcam-overlay, etc.) using [app_id=...] / [class=...].
