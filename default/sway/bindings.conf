# Swarmarchy — Sway default keybindings
# Translated from default/hypr/bindings/{tiling-v2,media,clipboard,utilities}.conf
# Hyprland `bindd = MOD, KEY, Description, dispatcher, arg` -> Sway `bindsym $mod+key command`
# The human "Description" field has no Sway equivalent; kept as ## comments.
# (omarchy-menu-keybindings parsed those descriptions and will need reworking.)

### Mouse: move with $mod+left-drag, resize with $mod+right-drag
floating_modifier $mod normal

# ───────────────────────── Tiling / windows ─────────────────────────
## Close window
bindsym $mod+w kill
## Close all windows  — TODO(port): omarchy-hyprland-window-close-all (hyprctl)
bindsym Ctrl+Alt+Delete exec omarchy-hyprland-window-close-all

## Toggle split direction (hypr togglesplit)
bindsym $mod+j split toggle
## Toggle floating (hypr togglefloating)
bindsym $mod+t floating toggle
## Fullscreen
bindsym $mod+f fullscreen toggle
## Global fullscreen (APPROX of hypr fullscreenstate/full-width)
bindsym $mod+Ctrl+f fullscreen toggle global
# DROPPED: hypr `pseudo` (SUPER+P) — no Sway equivalent
# DROPPED: SUPER+O pop-window-out, SUPER+L workspace-layout-toggle (hyprctl helpers)

## Move focus (arrows)
bindsym $mod+Left  focus left
bindsym $mod+Right focus right
bindsym $mod+Up    focus up
bindsym $mod+Down  focus down

## Move window (hypr swapwindow ~= Sway move)
bindsym $mod+Shift+Left  move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up    move up
bindsym $mod+Shift+Down  move down

## Switch workspace 1–10
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

## Move window to workspace 1–10
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

## Cycle workspaces
bindsym $mod+Tab       workspace next
bindsym $mod+Shift+Tab workspace prev
bindsym $mod+Ctrl+Tab  workspace back_and_forth

## Move workspace to another output (hypr movecurrentworkspacetomonitor)
bindsym $mod+Shift+Alt+Left  move workspace to output left
bindsym $mod+Shift+Alt+Right move workspace to output right
bindsym $mod+Shift+Alt+Up    move workspace to output up
bindsym $mod+Shift+Alt+Down  move workspace to output down

## Cycle windows (hypr cyclenext)
bindsym Alt+Tab       focus next
bindsym Alt+Shift+Tab focus prev

## Cycle monitors (hypr focusmonitor +/-1)
bindsym Ctrl+Alt+Tab       focus output right
bindsym Ctrl+Alt+Shift+Tab focus output left

## Resize (hypr resizeactive on -/= keys)
bindsym $mod+minus       resize shrink width 100px
bindsym $mod+equal       resize grow width 100px
bindsym $mod+Shift+minus resize shrink height 100px
bindsym $mod+Shift+equal resize grow height 100px

## Scroll workspaces with $mod + wheel
bindsym $mod+button4 workspace prev
bindsym $mod+button5 workspace next

## Scratchpad (hypr special workspace)
bindsym $mod+s     scratchpad show
bindsym $mod+Alt+s move scratchpad

## Window grouping — APPROX: Hyprland groups -> Sway tabbed/stacked containers
bindsym $mod+g     layout toggle split tabbed
bindsym $mod+Alt+g layout toggle tabbed stacking split
# DROPPED: granular hypr group nav (moveintogroup / changegroupactive 1-5)

## Monitor scaling — TODO(port): omarchy-hyprland-monitor-scaling-cycle (hyprctl -> swaymsg output scale)
bindsym $mod+slash     exec omarchy-hyprland-monitor-scaling-cycle
bindsym $mod+Alt+slash exec omarchy-hyprland-monitor-scaling-cycle --reverse

# ───────────────────────── Clipboard ─────────────────────────
## Clipboard manager (walker) — works on Sway
bindsym $mod+Ctrl+v exec omarchy-launch-walker -m clipboard
# DROPPED/TODO: Universal copy/cut/paste (hypr sendshortcut) needs `wtype`.
# Example once wtype is installed:
#   bindsym $mod+c exec wtype -M ctrl -P Insert -p Insert -m ctrl
#   bindsym $mod+v exec wtype -M shift -P Insert -p Insert -m shift
#   bindsym $mod+x exec wtype -M ctrl -P x -p x -m ctrl

# ───────────────────────── Launchers / menus ─────────────────────────
bindsym $mod+space        exec omarchy-launch-walker
bindsym $mod+Ctrl+e       exec omarchy-launch-walker -m symbols
bindsym $mod+Ctrl+o       exec omarchy-menu toggle
bindsym $mod+Ctrl+h       exec omarchy-menu hardware
bindsym $mod+Alt+space    exec omarchy-menu
bindsym $mod+Escape       exec omarchy-menu system
bindsym XF86PowerOff      exec omarchy-menu system
bindsym $mod+k            exec omarchy-menu-keybindings
bindsym XF86Calculator    exec gnome-calculator
bindsym $mod+Ctrl+c       exec omarchy-menu capture

# ───────────────────────── Aesthetics / toggles ─────────────────────────
bindsym $mod+Shift+space      exec omarchy-toggle-waybar
bindsym $mod+Ctrl+space       exec omarchy-menu background
bindsym $mod+Shift+Ctrl+space exec omarchy-menu theme
# DROPPED/TODO (hyprctl helpers, no clean Sway analog):
#   $mod+BackSpace window transparency, $mod+Shift+BackSpace window gaps,
#   $mod+Ctrl+BackSpace single-window square aspect

# Notifications (mako — unchanged)
bindsym $mod+comma            exec makoctl dismiss
bindsym $mod+Shift+comma      exec makoctl dismiss --all
bindsym $mod+Ctrl+comma       exec omarchy-toggle-notification-silencing
bindsym $mod+Alt+comma        exec makoctl invoke
bindsym $mod+Shift+Alt+comma  exec makoctl restore

# Toggles
bindsym $mod+Ctrl+i exec omarchy-toggle-idle
bindsym $mod+Ctrl+n exec omarchy-toggle-nightlight
## Laptop display toggles — TODO(port): omarchy-hyprland-monitor-internal* (hyprctl)
bindsym $mod+Ctrl+Delete     exec omarchy-hyprland-monitor-internal toggle
bindsym $mod+Ctrl+Alt+Delete exec omarchy-hyprland-monitor-internal-mirror toggle
## Lid switch (hypr `bindl switch:Lid`) -> Sway bindswitch
bindswitch --reload --locked lid:on  exec omarchy-hw-external-monitors && omarchy-hyprland-monitor-internal off
bindswitch --reload --locked lid:off exec omarchy-hyprland-monitor-internal on

# Captures
bindsym Print          exec omarchy-capture-screenshot
bindsym Alt+Print      exec omarchy-menu screenrecord
bindsym $mod+Ctrl+Print exec omarchy-capture-text-extraction
# DROPPED/TODO: $mod+Print color picker used hyprpicker (Hyprland-only).
#   Sway alt: a grim+slurp based picker or wl-color-picker.

# File sharing / transcoding / reminders
bindsym $mod+Ctrl+s     exec omarchy-menu share
bindsym $mod+Ctrl+period exec omarchy-transcode
bindsym $mod+Ctrl+r       exec omarchy-menu reminder-set
bindsym $mod+Ctrl+Alt+r   exec omarchy-reminder show
bindsym $mod+Shift+Ctrl+r exec omarchy-reminder clear

# Bar-less info popups
bindsym $mod+Ctrl+Alt+t exec notify-send -u low "    $(date +'%A %H:%M  ·  %d %B %Y  ·  Week %V')"
bindsym $mod+Ctrl+Alt+b exec notify-send -u low "$(omarchy-battery-status)"
bindsym $mod+Ctrl+Alt+w exec notify-send -u low "$(omarchy-weather-status)"

# Control panels
bindsym $mod+Ctrl+a exec omarchy-launch-audio
bindsym $mod+Ctrl+b exec omarchy-launch-bluetooth
bindsym $mod+Ctrl+w exec omarchy-launch-wifi
bindsym $mod+Ctrl+t exec omarchy-launch-tui btop

# Dictation
bindsym $mod+Ctrl+x       exec voxtype record toggle
bindsym F9                exec voxtype record start
bindsym --release F9      exec voxtype record stop

# DROPPED: $mod+Ctrl+z / $mod+Ctrl+Alt+z cursor zoom (hypr cursor:zoom_factor — no Sway equivalent)

# Lock system — TODO(port): omarchy-system-lock calls hyprlock -> swaylock
bindsym $mod+Ctrl+l exec omarchy-system-lock

# ───────────────────────── Media / hardware keys ─────────────────────────
bindsym --locked XF86AudioRaiseVolume  exec omarchy-swayosd-client --output-volume raise
bindsym --locked XF86AudioLowerVolume  exec omarchy-swayosd-client --output-volume lower
bindsym --locked XF86AudioMute         exec omarchy-swayosd-client --output-volume mute-toggle
bindsym --locked XF86AudioMicMute      exec omarchy-audio-input-mute
bindsym --locked XF86MonBrightnessUp   exec omarchy-brightness-display +5%
bindsym --locked XF86MonBrightnessDown exec omarchy-brightness-display 5%-
bindsym --locked Shift+XF86MonBrightnessUp   exec omarchy-brightness-display 100%
bindsym --locked Shift+XF86MonBrightnessDown exec omarchy-brightness-display 1%
bindsym --locked XF86KbdBrightnessUp   exec omarchy-brightness-keyboard up
bindsym --locked XF86KbdBrightnessDown exec omarchy-brightness-keyboard down
bindsym --locked XF86KbdLightOnOff     exec omarchy-brightness-keyboard cycle
bindsym --locked XF86TouchpadToggle    exec omarchy-toggle-touchpad

# Precise (Alt) volume/brightness
bindsym --locked Alt+XF86AudioRaiseVolume  exec omarchy-swayosd-client --output-volume +1
bindsym --locked Alt+XF86AudioLowerVolume  exec omarchy-swayosd-client --output-volume -1
bindsym --locked Alt+XF86MonBrightnessUp   exec omarchy-brightness-display +1%
bindsym --locked Alt+XF86MonBrightnessDown exec omarchy-brightness-display 1%-

# Media transport (playerctl)
bindsym --locked XF86AudioNext  exec omarchy-swayosd-client --playerctl next
bindsym --locked XF86AudioPause exec omarchy-swayosd-client --playerctl play-pause
bindsym --locked XF86AudioPlay  exec omarchy-swayosd-client --playerctl play-pause
bindsym --locked XF86AudioPrev  exec omarchy-swayosd-client --playerctl previous

# Switch audio output with Super + Mute
bindsym --locked $mod+XF86AudioMute exec omarchy-audio-output-switch
