# Swarmarchy — Sway default keybindings
# Human-readable descriptions are kept as `## ` comments (parsed by swarmarchy-menu-keybindings).

### Mouse: move with $mod+left-drag, resize with $mod+right-drag
floating_modifier $mod normal

# ───────────────────────── Tiling / windows ─────────────────────────
# SUPER+w/t/f/s are reserved for the Mac-style app shortcuts below, so the window
# commands that used to own those letters moved to SUPER+ALT.
## Close window
bindsym $mod+Alt+q kill

## Toggle split direction
bindsym $mod+Alt+s split toggle
## Toggle floating
bindsym $mod+Alt+t floating toggle
## Fullscreen
bindsym $mod+Alt+f fullscreen toggle
# DROPPED: pseudotile (SUPER+P) — no Sway equivalent
# DROPPED: SUPER+O pop-window-out, SUPER+L workspace-layout-toggle

## Move focus (vim keys; SUPER+arrows are Home/End in the Mac layer below)
bindsym $mod+Alt+h focus left
bindsym $mod+Alt+j focus down
bindsym $mod+Alt+k focus up
bindsym $mod+Alt+l focus right

## Move window
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

## Switch workspace 1–8
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8

## Move window to workspace 1–8
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8

## Cycle workspaces
bindsym $mod+Tab       workspace next
bindsym $mod+Shift+Tab workspace prev

## Move workspace to another output
bindsym $mod+Alt+Shift+h move workspace to output left
bindsym $mod+Alt+Shift+j move workspace to output down
bindsym $mod+Alt+Shift+k move workspace to output up
bindsym $mod+Alt+Shift+l move workspace to output right

## Resize
bindsym $mod+Alt+Left  resize shrink width 100px
bindsym $mod+Alt+Down  resize shrink height 100px
bindsym $mod+Alt+Up    resize grow height 100px
bindsym $mod+Alt+Right resize grow width 100px

## Scroll workspaces with $mod + wheel
bindsym $mod+button4 workspace prev
bindsym $mod+button5 workspace next

## Scratchpad
bindsym $mod+Alt+m       scratchpad show
## Send window to scratchpad
bindsym $mod+Alt+Shift+m move scratchpad

## Window grouping
bindsym $mod+Alt+g layout toggle split tabbed
# DROPPED: granular group navigation (move-into-group / change-active 1-5)

## Monitor scaling
bindsym $mod+Alt+equal exec swarmarchy-wm-monitor-scaling-cycle
## Monitor scaling (reverse)
bindsym $mod+Alt+minus exec swarmarchy-wm-monitor-scaling-cycle --reverse

# ───────────────────────── Clipboard ─────────────────────────
## Clipboard manager (walker)
bindsym $mod+Ctrl+v exec swarmarchy-launch-walker -m clipboard
# ──────────────── Mac-style app shortcuts (SUPER acts as Command) ────────────────
# SUPER carries the app-level editing commands so CTRL keeps its terminal meaning
# (CTRL+c interrupt, CTRL+a/e line motion, CTRL+u kill-to-start). wtype synthesises
# the keystroke the focused app actually expects.
#
# Copy/paste need no app test: CTRL+Insert / SHIFT+Insert are the legacy universal
# clipboard keys, honoured by GTK/Chromium *and* by foot (see config/foot/foot.ini,
# which binds Control+Insert and Shift+Insert alongside Control+Shift+c/v).
## Copy
bindsym $mod+c exec wtype -M ctrl  -P Insert -p Insert -m ctrl
## Paste
bindsym $mod+v exec wtype -M shift -P Insert -p Insert -m shift
#
# The rest inject CTRL+<key>, which is a live control code in a terminal — CTRL+w
# erases a word, CTRL+z suspends, CTRL+s sends XOFF and appears to hang the tty. So
# they go through swarmarchy-key-mac, which skips injection when a terminal is focused.
## Cut
bindsym $mod+x exec swarmarchy-key-mac ctrl x
## New tab
bindsym $mod+t exec swarmarchy-key-mac ctrl t
## Close tab
bindsym $mod+w exec swarmarchy-key-mac ctrl w
## Undo
bindsym $mod+z exec swarmarchy-key-mac ctrl z
## Redo
bindsym $mod+y exec swarmarchy-key-mac ctrl y
## Select all
bindsym $mod+a exec swarmarchy-key-mac ctrl a
## Save
bindsym $mod+s exec swarmarchy-key-mac ctrl s
## Find
bindsym $mod+f exec swarmarchy-key-mac ctrl f
## Reload page
bindsym $mod+r exec swarmarchy-key-mac ctrl r
## New window
bindsym $mod+n exec swarmarchy-key-mac ctrl n
## Print
bindsym $mod+p exec swarmarchy-key-mac ctrl p
## Last tab
bindsym $mod+9 exec swarmarchy-key-mac ctrl KP_9
# Zoom and last tab are sent as keypad keys: Chromium/Brave ignores =, - and the
# digits when wtype synthesises them, but honours the keypad versions. Zoom is sent
# unguarded, so in a terminal foot changes the font size (it binds the keypad keys too).
## Zoom in
bindsym $mod+equal exec wtype -M ctrl -k KP_Add -m ctrl
## Zoom out
bindsym $mod+minus exec wtype -M ctrl -k KP_Subtract -m ctrl
## Reset zoom
bindsym $mod+0     exec wtype -M ctrl -k KP_0 -m ctrl
## Reopen closed tab
bindsym $mod+Shift+t exec swarmarchy-key-mac ctrl shift t
## Focus the address bar
bindsym $mod+l exec swarmarchy-key-mac ctrl l
## History
bindsym $mod+h exec swarmarchy-key-mac ctrl h
## Back / Forward — ALT+arrow is the actual Chromium/Brave shortcut on Linux, and
## must stay guarded: tmux binds M-Left/M-Right to select-window.
bindsym $mod+bracketleft  exec swarmarchy-key-mac alt Left
bindsym $mod+bracketright exec swarmarchy-key-mac alt Right
## Previous / next tab
bindsym $mod+Shift+bracketleft  exec swarmarchy-key-mac ctrl shift Tab
bindsym $mod+Shift+bracketright exec swarmarchy-key-mac ctrl Tab
#
# Home/End need no app test: they mean start/end-of-line in a terminal too, which is
# exactly what Mac's CMD+left/right do.
## Line start
bindsym $mod+Left  exec wtype -P Home -p Home
## Line end
bindsym $mod+Right exec wtype -P End  -p End
## Select to line start
bindsym $mod+Shift+Left  exec wtype -M shift -P Home -p Home -m shift
## Select to line end
bindsym $mod+Shift+Right exec wtype -M shift -P End  -p End  -m shift

# ───────────────────────── Launchers / menus ─────────────────────────
bindsym $mod+space        exec swarmarchy-menu
bindsym $mod+Ctrl+o       exec swarmarchy-menu toggle
## Hardware menu
bindsym $mod+Ctrl+h       exec swarmarchy-menu hardware
bindsym $mod+Escape       exec swarmarchy-menu system
bindsym XF86PowerOff      exec swarmarchy-menu system
bindsym $mod+m            exec swarmarchy-menu-keybindings
bindsym $mod+Ctrl+c       exec swarmarchy-menu capture

# ───────────────────────── Aesthetics / toggles ─────────────────────────
# DROPPED/TODO (no clean Sway analog):
#   $mod+BackSpace window transparency, $mod+Shift+BackSpace window gaps,
#   $mod+Ctrl+BackSpace single-window square aspect

# Notifications (mako — unchanged)
## Dismiss notification
bindsym $mod+Ctrl+period       exec makoctl dismiss
## Dismiss all notifications
bindsym $mod+Ctrl+Shift+period exec makoctl dismiss --all
## Restore last notification
bindsym $mod+Ctrl+comma        exec makoctl restore
## Open notification action
bindsym $mod+Ctrl+Shift+comma  exec makoctl invoke
## Silence notifications
bindsym $mod+Ctrl+n            exec swarmarchy-toggle-notification-silencing

# Toggles
bindsym $mod+Ctrl+i exec swarmarchy-toggle-idle
## Nightlight
bindsym $mod+Ctrl+l exec swarmarchy-toggle-nightlight
## Lid switch
bindswitch --reload --locked lid:on  exec swarmarchy-hw-external-monitors && swarmarchy-wm-monitor-internal off
bindswitch --reload --locked lid:off exec swarmarchy-wm-monitor-internal on

# Captures
bindsym Alt+Print   exec swarmarchy-menu screenrecord
## Extract text from screen
bindsym $mod+Ctrl+x exec swarmarchy-capture-text-extraction
# DROPPED/TODO: $mod+Print color picker.
#   Sway alt: a grim+slurp based picker or wl-color-picker.

# File sharing / transcoding / reminders
bindsym $mod+Ctrl+s     exec swarmarchy-menu share
## Transcode
bindsym $mod+Ctrl+t      exec swarmarchy-transcode
## Set reminder
bindsym $mod+Ctrl+r       exec swarmarchy-menu reminder-set
## Show reminders
bindsym $mod+Ctrl+Shift+r exec swarmarchy-reminder show
## Erase a reminder
bindsym $mod+Ctrl+e       exec swarmarchy-reminder cancel

# Control panels
bindsym $mod+Ctrl+a exec swarmarchy-launch-audio
bindsym $mod+Ctrl+b exec swarmarchy-launch-bluetooth
bindsym $mod+Ctrl+w exec swarmarchy-launch-wifi
## System monitor (btop)
bindsym $mod+Ctrl+m exec swarmarchy-launch-tui btop

# DROPPED: $mod+Ctrl+z / $mod+Ctrl+Alt+z cursor zoom (no Sway equivalent)

# Lock system
bindsym $mod+Ctrl+q exec swarmarchy-system-lock

# ───────────────────────── Media / hardware keys ─────────────────────────
bindsym --locked XF86AudioRaiseVolume  exec swarmarchy-swayosd-client --output-volume raise
bindsym --locked XF86AudioLowerVolume  exec swarmarchy-swayosd-client --output-volume lower
bindsym --locked XF86AudioMute         exec swarmarchy-swayosd-client --output-volume mute-toggle
bindsym --locked XF86AudioMicMute      exec swarmarchy-audio-input-mute
bindsym --locked XF86MonBrightnessUp   exec swarmarchy-brightness-display +5%
bindsym --locked XF86MonBrightnessDown exec swarmarchy-brightness-display 5%-
bindsym --locked XF86KbdBrightnessUp   exec swarmarchy-brightness-keyboard up
bindsym --locked XF86KbdBrightnessDown exec swarmarchy-brightness-keyboard down
bindsym --locked XF86KbdLightOnOff     exec swarmarchy-brightness-keyboard cycle
bindsym --locked XF86TouchpadToggle    exec swarmarchy-toggle-touchpad

# Media transport (playerctl)
bindsym --locked XF86AudioNext  exec swarmarchy-swayosd-client --playerctl next
bindsym --locked XF86AudioPause exec swarmarchy-swayosd-client --playerctl play-pause
bindsym --locked XF86AudioPlay  exec swarmarchy-swayosd-client --playerctl play-pause
bindsym --locked XF86AudioPrev  exec swarmarchy-swayosd-client --playerctl previous

# Switch audio output with Super + Mute
bindsym --locked $mod+XF86AudioMute exec swarmarchy-audio-output-switch
