# Swarmarchy — Sway autostart
# `exec` runs once on config load.

# Make the session env available to systemd user services and portals.
# (Previously handled by uwsm, which has been removed.)
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP SWAYSOCK DISPLAY
exec hash dbus-update-activation-environment 2>/dev/null && \
    dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP SWAYSOCK DISPLAY

# Idle/lock/sleep management (swayidle + swaylock).
exec swarmarchy-swayidle

# Notifications
exec mako

# Top bar (unless toggled off)
exec sh -c 'swarmarchy-toggle-enabled waybar-off || waybar'

# Wallpaper
exec swaybg -i ~/.config/swarmarchy/current/background -m fill

# Polkit agent (privilege prompts)
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Swarmarchy lifecycle hooks
exec swarmarchy-first-run
exec swarmarchy-powerprofiles-init
exec sleep 2 && swarmarchy-hook post-boot

# DROPPED: fcitx5 autostart (fcitx5 removed from package set)
