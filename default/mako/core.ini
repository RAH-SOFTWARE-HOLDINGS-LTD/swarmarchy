anchor=top-right
group-by=app-name,summary,body
sort=-time
max-visible=15
max-history=15
default-timeout=5000
width=420
outer-margin=20
padding=10,15
border-size=2
max-icon-size=32
font=sans-serif 14px

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false

[urgency=critical]
default-timeout=0
layer=overlay

[summary~="Setup Wi-Fi"]
on-button-left=exec sh -c 'swarmarchy-notification-dismiss "Setup Wi-Fi"; swarmarchy-launch-wifi'

[summary~="Learn Keybindings"]
on-button-left=exec sh -c 'swarmarchy-notification-dismiss "Learn Keybindings"; swarmarchy-menu-keybindings'

[summary~="Screenshot copied & saved"]
max-icon-size=80
format=<b>%s</b>\n%b
