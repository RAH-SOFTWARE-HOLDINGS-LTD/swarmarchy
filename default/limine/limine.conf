### Read more at config document: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
# Menu wait, then boot default_entry. Limine has no conditional behaviour: it always shows
# the menu for `timeout` seconds and then boots `default_entry`, whatever the entry count.
#
# This was `#timeout: 3` (commented out), so Limine fell back to its built-in 5s wait --
# 3.692s of a measured 17.75s startup (firmware 9.812 + loader 3.692 + kernel 1.157 +
# userspace 3.088). Windows is reached through the firmware menu (F12), not Limine.
#
# 2s rather than 0: snapper adds snapshot entries after a kernel update, and a 0 timeout
# would boot straight past them -- exactly when a bad update is the reason you want one.
# 2s keeps that recovery path reachable for ~1.7s less than the old default.
#
# default_entry is 1, not 2: a stock install writes exactly one entry (/Swarmarchy), so 2
# pointed past the end -- Limine could not act on it and sat at the menu waiting for input,
# which is why it never auto-selected. BOOT_ORDER in default.conf is "*, *fallback,
# Snapshots", so the running system is always first and snapshots are appended after it;
# 1 therefore stays correct as snapshots accumulate.
timeout: 2
default_entry: 1
interface_branding: Swarmarchy Bootloader
interface_branding_color: 9ece6a
interface_help_color: 9ece6a
interface_help_color_bright: 9ece6a
hash_mismatch_panic: no

term_background: 1a1b26
backdrop: 1a1b26

# Terminal colors (Tokyo Night palette)
term_palette: 15161e;f7768e;9ece6a;e0af68;7aa2f7;bb9af7;7dcfff;a9b1d6
term_palette_bright: 414868;f7768e;9ece6a;e0af68;7aa2f7;bb9af7;7dcfff;c0caf5

# Text colors
term_foreground: c0caf5
term_foreground_bright: c0caf5
term_background_bright: 24283b
