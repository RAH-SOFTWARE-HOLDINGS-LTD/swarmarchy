### Read more at config document: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
# Boot straight into the default entry. Commented out, Limine falls back to its
# built-in 5-second wait, which measured 3.692s of the new install's 17.75s boot
# (firmware 9.812s + loader 3.692s + kernel 1.157s + userspace 3.088s). There is
# only one OS entry here -- Windows is reached via the firmware menu (F12), not
# Limine -- so there is nothing to choose and nothing lost by not waiting.
# 1 rather than 0 on purpose: `default_entry` below is 2, but a stock install writes only
# one entry (/Swarmarchy), so a 0 timeout with an out-of-range default risks sitting at the
# menu instead of booting. 1s always makes forward progress. Revisit together with
# default_entry if ENABLE_LIMINE_FALLBACK / snapshot entries change the ordering.
timeout: 1
default_entry: 2
interface_branding: Swarmarchy Bootloader
interface_branding_color: 9ece6a
interface_help_color: 9ece6a
interface_help_color_bright: 9ece6a
hash_mismatch_panic: no

term_background: 1a1b26
backdrop: 1a1b26

# Terminal colors (Tokyo Night palette)
term_palette: 15161e;f7768e;9ece6a;e0af68;7aa2f7;bb9af7;7dcfff;a9b1d6
term_palette_bright: 414868;f7768e;9ece6a;e0af68;7aa2f7;bb9af7;7dcfff;c0caf5

# Text colors
term_foreground: c0caf5
term_foreground_bright: c0caf5
term_background_bright: 24283b
